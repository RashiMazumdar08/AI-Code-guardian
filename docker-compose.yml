version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guardian_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=guardian_db
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
